[project]
name = "medblue-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "espona", email = "lucia.espona@ua.es" }
]
dependencies = [
    "alembic>=1.20.0",
    "alembic-postgresql-enum>=1.11.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.163.2",
    "psycopg[binary]>=3.3.9",
    "sqlmodel>=0.0.50",
    "unidecode>=1.4.0",
    "uvicorn[standard]>=0.54.0",
]
requires-python = ">=3.15"

[tool.uv]
package = false   # 💡 This stops uv from expecting src/your_project_name/

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[project.scripts]
medblue-data = "app:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "psycopg2-binary",
    "pytest>=9.1.1",
    "testcontainers>=4.15.0",
]
